name: PolinRider Malware Scan (Reusable)

# Call this from any repo's pipeline:
#
# jobs:
#   malware-scan:
#     uses: YOUR_ORG/security-tools/.github/workflows/polinrider-scan-reusable.yml@main
#
# Then make your deploy/merge jobs depend on it:
#
#   build:
#     needs: malware-scan
#     ...
#
# This job FAILS the run if PolinRider signatures are found, blocking
# whatever depends on it (merge checks, deploy jobs, etc).

on:
  workflow_call:
    inputs:
      js_all:
        description: "Scan all .js files, not just known config files"
        type: boolean
        default: false
        required: false
      verbose:
        description: "Verbose scanner output"
        type: boolean
        default: true
        required: false

jobs:
  scan:
    name: Scan for PolinRider malware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so reflog/log checks are meaningful

      - name: Fetch scanner script
        env:
          GH_TOKEN: ${{ secrets.SECURITY_TOOLS_PAT || github.token }}
        run: |
          # Pulls the canonical scanner from the org's security-tools repo.
          # Update OWNER/security-tools below to match your org.
          curl -sSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/${{ github.repository_owner }}/security-tools/contents/scripts/polinrider-scanner.sh?ref=main" \
            -o polinrider-scanner.sh
          chmod +x polinrider-scanner.sh

      - name: Run scanner
        run: |
          ARGS=""
          if [ "${{ inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          if [ "${{ inputs.js_all }}" = "true" ]; then
            ARGS="$ARGS --js-all"
          fi
          ./polinrider-scanner.sh $ARGS "${{ github.workspace }}"

      - name: Upload scan log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polinrider-scan-log-${{ github.run_id }}
          path: |
            ./*.log
          if-no-files-found: ignore
