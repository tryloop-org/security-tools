name: PolinRider Malware Scan (Reusable)

# Call this from any repo's pipeline:
#
# jobs:
#   malware-scan:
#     uses: YOUR_ORG/security-tools/.github/workflows/polinrider-scan-reusable.yml@main
#
# Then make your deploy/merge jobs depend on it:
#
#   build:
#     needs: malware-scan
#     ...
#
# This job FAILS the run if PolinRider signatures are found, blocking
# whatever depends on it (merge checks, deploy jobs, etc).

on:
  workflow_call:
    inputs:
      js_all:
        description: "Scan all .js files, not just known config files"
        type: boolean
        default: false
        required: false
      verbose:
        description: "Verbose scanner output"
        type: boolean
        default: true
        required: false

jobs:
  scan:
    name: Scan for PolinRider malware
    runs-on: ai-garden
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout security-tools (scanner source)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/security-tools
          ref: main
          path: security-tools
          # github.token works for private repos in the same org
          # when the workflow is called with secrets: inherit
          token: ${{ secrets.SECURITY_TOOLS_PAT || github.token }}

      - name: Run scanner
        run: |
          chmod +x security-tools/scripts/polinrider-scanner.sh
          ARGS=""
          if [ "${{ inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          if [ "${{ inputs.js_all }}" = "true" ]; then
            ARGS="$ARGS --js-all"
          fi
          ./security-tools/scripts/polinrider-scanner.sh $ARGS ./target

      - name: Upload scan log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polinrider-scan-log-${{ github.run_id }}
          path: "*.log"
          if-no-files-found: ignore
